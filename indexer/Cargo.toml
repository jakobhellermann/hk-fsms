[package]
name = "fsm-indexer"
version = "0.1.0"
edition = "2024"
default-run = "fsm-indexer"

[dependencies]
anyhow = "1.0"
dotnetdll = "0.3"
playmakerfsm = { path = "../../playmakerfsm" }
rabex = "0.2"
rabex-env = { git = "https://github.com/jakobhellermann/rabex-env" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tikv-jemallocator = "0.7.0"

[[bin]]
name = "dump-pseudo"
path = "src/bin/dump_pseudo.rs"

[patch.crates-io]
rabex = { path = "../../RustyAssetBundleEXtractor" }
dotnetdll = { git = "https://github.com/jakobhellermann/dotnetdll", branch = "wip" }
